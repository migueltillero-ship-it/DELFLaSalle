<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Portal DELF 2026 · Alliance Française & La Salle</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<style>
/* ================= VARIABLES GLOBALES Y 3D (ADMIN) ================= */
:root {
    --rouge: #DA002E; --bleu: #013896; --bg-3d: #e0e5ec;
    --shadow-light: #ffffff; --shadow-dark: #a3b1c6; --text-dark: #1A1A1A;
    --green: #1a8a4a;
    /* Variables Módulo Alumnos */
    --af-red:#C8211E; --af-red-dark:#8a1715; --af-gold:#A8843E; --af-bg:#f5f0eb;
    --af-dark:#1a1a1a; --af-text:#2d2d2d; --af-muted:#5b5b5b; --af-line:rgba(200,33,30,.18);
    --azul-francia:#002654; --card-bg:rgba(255,255,255,.97); --card-border:rgba(0,0,0,.06);
    --sombra-sm:0 2px 10px rgba(0,0,0,.04); --sombra-md:0 12px 30px rgba(0,0,0,.08); --sombra-lg:0 30px 80px rgba(0,0,0,.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Outfit', sans-serif; background-color: var(--bg-3d); color: var(--text-dark); overflow-x: hidden; scroll-behavior: smooth; }
body.intro-active { overflow: hidden; }

/* ================= SPLASH & GLOBAL AUDIO ================= */
#splash-screen { position: fixed; inset: 0; background: var(--bg-3d); z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.8s ease; flex-direction: column; padding: 20px;}
#audio-btn {
    position: fixed; bottom: 25px; right: 25px; z-index: 9990; width: 55px; height: 55px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(1,56,150,0.9); backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center; transition: 0.3s; opacity: 0; pointer-events: none; color: #fff;
}
#audio-btn.show { opacity: 1; pointer-events: auto; }
#audio-btn:hover { transform: scale(1.1); background: var(--rouge); }

/* ================= CSS MÓDULO DE VALIDACIÓN (3D) ================= */
#app-admin .video-hero { position: relative; width: 100vw; height: 100vh; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border-bottom: 6px solid var(--rouge); background: #000; }
#app-admin .video-hero video { width: 100%; height: 100%; object-fit: cover; }
#app-admin .video-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(1,56,150,0.7) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.9) 100%); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 50px 20px; opacity: 0; transition: opacity 1.5s ease; }
#app-admin .logos-hero { display: flex; gap: 30px; align-items: center; background: rgba(255,255,255,0.95); padding: 15px 40px; border-radius: 100px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
#app-admin .logos-hero img { height: 70px; object-fit: contain; mix-blend-mode: multiply; }

.btn-chrome {
    background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 40%, #cccccc 50%, #eeeeee 100%); color: var(--bleu); padding: 16px 35px; border-radius: 50px; font-weight: 800; text-transform: uppercase; border: 1px solid #999; cursor: pointer; transition: 0.3s; box-shadow: inset 0 2px 4px #fff, inset 0 -2px 4px rgba(0,0,0,0.2), 6px 6px 15px rgba(0,0,0,0.3); text-shadow: 1px 1px 0px #fff; font-size: 1rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Outfit', sans-serif;
}
.btn-chrome:hover { transform: translateY(-3px); color: var(--rouge); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
.btn-chrome.primary { background: linear-gradient(180deg, var(--bleu) 0%, #012b73 100%); color: #fff; text-shadow: 1px 1px 2px #000; border: 1px solid #001540; }
.btn-chrome.primary:hover { background: linear-gradient(180deg, var(--rouge) 0%, #9B0C24 100%); border-color: #6a0818; }
.btn-ghost { background: transparent; box-shadow: none; border: 2px solid var(--shadow-dark); color: var(--text-dark); }
.btn-ghost:hover { border-color: var(--rouge); color: var(--rouge); box-shadow: none; }

#app-admin .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
#app-admin .stat-pill { background: var(--bg-3d); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light); border: 1px solid rgba(255,255,255,0.6); }
#app-admin .stat-pill .num { font-size: 2.5rem; font-weight: 800; font-family: 'Playfair Display', serif; line-height: 1; }
#app-admin .stat-pill .lbl { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--shadow-dark); margin-top: 5px; }

#app-admin .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; display: none; opacity: 0; transition: opacity 1s; }
#app-admin .card-3d { background: var(--bg-3d); border-radius: 30px; padding: 40px; box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light); border: 1px solid #fff; }
#app-admin .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; margin-bottom: 20px;}
#app-admin input { padding: 18px; border-radius: 12px; border: none; background: var(--bg-3d); box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light); font-weight: 600; text-transform: uppercase; width: 100%; outline: none; font-size: 1rem; font-family: 'Outfit';}
#app-admin input:focus { box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light), 0 0 0 2px var(--bleu); }

#app-admin .ficha { background: #fff; border-radius: 20px; overflow: hidden; box-shadow: inset 3px 3px 10px var(--shadow-dark); margin-top: 20px; text-align: left; }
#app-admin .ficha-header { background: linear-gradient(135deg, var(--bleu) 0%, #012b73 100%); padding: 20px; display: flex; align-items: center; gap: 15px; color: #fff; }
#app-admin .ficha-icon { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; }
#app-admin .ficha-body { padding: 25px; }
#app-admin .ficha-row { display: flex; align-items: center; gap: 15px; padding: 12px 0; border-bottom: 1px solid #eee; }
#app-admin .ficha-row:last-child { border-bottom: none; }
#app-admin .ficha-row-icon { width: 35px; height: 35px; border-radius: 8px; background: #f0f4ff; display: flex; align-items: center; justify-content: center; color: var(--bleu); }
#app-admin .ficha-row-content { display: flex; flex-direction: column; }
#app-admin .ficha-row-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #888; }
#app-admin .ficha-row-value { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); }
#app-admin .ficha-footer { background: #f8fafc; padding: 15px 25px; font-size: 0.8rem; color: #666; border-top: 1px solid #eee; }

/* ================= CSS MÓDULO ALUMNOS (VANTA + FORMSUBMIT) ================= */
#app-alumno { font-family: 'Inter', -apple-system, sans-serif; font-size: 17px; line-height: 1.7; color: var(--af-text); }
#vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: .55; }
#app-alumno h1, #app-alumno h2, #app-alumno h3, #app-alumno h4 { font-family: 'Playfair Display', serif; color: var(--af-dark); }

.screen { display: none; min-height: 100vh; animation: fadeIn 0.5s ease; }
.screen.active { display: block; }
.screen.video-screen.active { display: flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes fadeOut { from{opacity:1} to{opacity:0} }
.fade-out { animation: fadeOut 0.6s forwards !important; }

#app-alumno .video-screen { position: fixed; inset: 0; background: #000; z-index: 1000; align-items: center; justify-content: center; flex-direction: column; }
#app-alumno .video-screen video { width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; object-fit: contain; }
#app-alumno .video-controls { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 2; }
#app-alumno .btn-video { padding: 13px 28px; background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 50px; font-family: inherit; font-weight: 600; cursor: pointer; backdrop-filter: blur(12px); transition: all .25s; }
#app-alumno .btn-video:hover { background: rgba(255,255,255,.3); border-color: #fff; }
#app-alumno .btn-video.primary { background: var(--af-red); border-color: var(--af-red); }
#app-alumno .btn-video.primary:hover { background: #fff; color: var(--af-red); }

#app-alumno .hero { background: transparent; padding: 80px 24px 90px; text-align: center; position: relative; }
#app-alumno .hero-logos { display: flex; justify-content: center; align-items: center; gap: 28px; margin-bottom: 32px; flex-wrap: wrap; }
#app-alumno .hero-logos img { height: 80px; background: #fff; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--sombra-md); }
#app-alumno .hero-divider { width: 1px; height: 54px; background: var(--af-line); }
#app-alumno .hero-sub { background: var(--card-bg); padding: 18px 28px; border-radius: 8px; border: 1px solid var(--card-border); box-shadow: var(--sombra-sm); max-width: 680px; margin: 0 auto; }
#app-alumno .date-badge { display: inline-flex; align-items: center; gap: 14px; background: var(--af-dark); color: #fff; padding: 16px 32px; border-radius: 50px; font-weight: 600; margin-top: 14px; }

#app-alumno .chapter { padding: 60px 24px; position: relative; }
#app-alumno .chapter-header { max-width: 900px; margin: 0 auto 30px; text-align: center; }
#app-alumno .content-section { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 50px 48px; margin: 0 auto 24px; box-shadow: var(--sombra-lg); max-width: 980px; text-align: left;}
#app-alumno .section-tag { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--af-red); margin-bottom: 14px; }
#app-alumno .section-tag::before { content: ""; width: 32px; height: 2px; background: var(--af-red); border-radius: 2px; }

#app-alumno .chapter-nav { max-width: 900px; margin: 50px auto 0; display: flex; justify-content: space-between; align-items: center; gap: 14px; }
#app-alumno .btn-prev, #app-alumno .btn-next { padding: 15px 30px; border: 1px solid var(--af-line); background: #fff; color: var(--af-dark); font-weight: 600; border-radius: 50px; cursor: pointer; transition: all .3s; }
#app-alumno .btn-next { background: var(--af-red); color: #fff; border-color: var(--af-red); }

#app-alumno .info-grid, #app-alumno .niveles-grid, #app-alumno .contact-grid { display: grid; gap: 18px; margin
